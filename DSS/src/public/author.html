<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Author Info</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #FFE1E9 0%, #F472B6 50%, #BE185D 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }
        .card {
            background: linear-gradient(145deg, #FFFFFF 0%, #FFF1F9 100%);
            border: 3px solid #F9A8D4;
            box-shadow: 0 12px 24px rgba(244, 114, 182, 0.4), 0 0 12px rgba(244, 114, 182, 0.3);
            border-radius: 1.5rem;
            position: relative;
            overflow: hidden;
            animation: fadeIn 1s ease-in-out;
            padding: 2.5rem;
        }
        @keyframes fadeIn {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .card::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: radial-gradient(circle, rgba(249, 168, 212, 0.2) 0%, transparent 60%);
            transform: rotate(30deg);
            z-index: 0;
        }
        .card > * {
            position: relative;
            z-index: 1;
        }
        .btn-pink {
            background: linear-gradient(90deg, #F472B6 0%, #BE185D 100%);
            color: white;
            padding: 14px 28px;
            border-radius: 9999px;
            display: inline-block;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border: 2px solid #FFFFFF;
        }
        .btn-pink:hover {
            background: linear-gradient(90deg, #BE185D 0%, #9D174D 100%);
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(244, 114, 182, 0.6);
        }
        .btn-pink:active {
            background: linear-gradient(90deg, #9D174D 0%, #831843 100%);
            transform: translateY(0);
        }
        .btn-pink:focus {
            outline: none;
            box-shadow: 0 0 0 4px rgba(244, 114, 182, 0.5);
        }
        .author-img {
            border: 4px solid #F9A8D4;
            transition: transform 0.3s ease;
        }
        .author-img:hover {
            transform: scale(1.05);
        }
        h1 {
            background: linear-gradient(45deg, #BE185D, #F472B6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="flex items-center justify-center p-6">
<div class="card rounded-2xl max-w-4xl w-full text-center">
    <h1 class="text-5xl font-bold mb-10">Meet the Creators</h1>

    <!-- Author Images -->
    <div class="flex flex-col md:flex-row gap-8 justify-center items-center mb-12">
        <img src="/image/Denis.jpg" alt="Author 1" class="w-72 h-72 object-cover rounded-2xl shadow-lg author-img">
        <img src="/image/Dias.jpg" alt="Author 2" class="w-72 h-72 object-cover rounded-2xl shadow-lg author-img">
    </div>

    <!-- Instagram Buttons -->
    <div class="flex flex-col sm:flex-row gap-6 justify-center mb-8">
        <a href="https://www.instagram.com/mityanin_denis/" target="_blank" class="btn-pink">Follow Creator 1 on Instagram</a>
        <a href="https://www.instagram.com/bez5566/" target="_blank" class="btn-pink">Follow Creator 2 on Instagram</a>
    </div>

    <!-- Song Link -->
    <div class="mb-10">
        <a href="https://youtu.be/-dZmLeHrIjw" target="_blank" class="btn-pink">🎵 Listen to Our Song</a>
    </div>

    <!-- Back to Dashboard -->
    <div>
        <a href="dashboard.html" class="btn-pink">← Back to Dashboard</a>
    </div>
</div>

<script>
    $(document).ready(function () {
        // Ensure buttons work as expected without overriding default behavior
        $(".btn-pink").on("click", function (e) {
            // Allow default anchor behavior for external links
            if (this.href.includes("instagram.com") || this.href.includes("spotify.com")) {
                return; // Let the browser handle external links
            }
            // Handle internal navigation (dashboard.html)
            if (this.href.includes("dashboard.html")) {
                e.preventDefault();
                window.location.href = "dashboard.html";
            }
        });
    });
</script>
</body>
</html>
